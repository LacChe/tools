<!DOCTYPE html>
<html lang="en" data-app="cycle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Cycle</title>
  <link rel="stylesheet" href="../../base.css?v=9">
  <link rel="stylesheet" href="../../theme.css?v=9">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <p class="status" id="status" role="status" data-i18n="loading">Loading…</p>
  <main class="page" id="app" hidden>
    <header class="bar bar-centered">
      <a class="btn" href="../../index.html" data-i18n="home">Home</a>
      <h1 data-i18n="title">Cycle</h1>
      <!-- Holds the place of the settings button other apps have, so the title lines up with theirs. -->
      <span class="bar-icon" aria-hidden="true"></span>
    </header>

    <nav class="view-toggle" aria-label="View" data-i18n-aria="view">
      <button type="button" id="tabLog" aria-pressed="true" data-i18n="log">Log</button>
      <button type="button" id="tabDetails" aria-pressed="false" data-i18n="details">Details</button>
    </nav>

    <div id="logView">
    <form class="stack compact" id="entryForm" novalidate>
      <label class="field"><span data-i18n="date">Date</span>
        <input type="date" id="fDate" required>
      </label>
      <div class="field"><span data-i18n="flow">Flow</span>
        <div class="segmented" id="fFlow" role="group" aria-label="Flow" data-i18n-aria="flow"></div>
      </div>
      <div class="field"><span data-i18n="pain">Pain</span>
        <div class="segmented" id="fPain" role="group" aria-label="Pain" data-i18n-aria="pain"></div>
      </div>
      <label class="field"><span data-i18n="note">Note</span>
        <input type="text" id="fNote" maxlength="500" autocomplete="off">
      </label>
      <button type="submit" id="saveBtn" data-i18n="save">Save</button>
      <button type="button" class="danger-btn" id="clearBtn" data-i18n="clearDay" hidden>Clear day</button>
      <p class="error" id="formError" role="alert"></p>
      <p class="success" id="formOk" role="status"></p>
    </form>
    </div>
    <div id="detailsView" hidden></div>
    <p class="error" id="readError" role="alert" hidden></p>
  </main>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
