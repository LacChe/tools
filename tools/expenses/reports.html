<!DOCTYPE html>
<html lang="en" data-app="expenses">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Expenses · Reports</title>
  <link rel="stylesheet" href="../../base.css">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="status" id="status" role="status">Loading…</p>
  <main class="page" id="app" hidden>
    <header class="bar">
      <a class="btn" href="../../index.html">Home</a>
      <h1>Expenses</h1>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>

    <nav class="view-toggle" aria-label="View">
      <a href="index.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        Records
      </a>
      <a href="reports.html" aria-current="page">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        Reports
      </a>
    </nav>

    <form class="stack compact" id="rangeForm" onsubmit="return false">
      <div class="field-row">
        <label class="field">From
          <input type="date" id="rFrom" required>
        </label>
        <label class="field">To
          <input type="date" id="rTo" required>
        </label>
        <label class="field cur-field">Currency
          <select id="rCurrency" required></select>
        </label>
      </div>
    </form>
    <p class="error" id="reportError" role="alert"></p>

    <div id="reportBody" hidden>
      <div class="donut-wrap">
        <svg id="donut" viewBox="0 0 120 120" role="img" aria-label="Spending by type"></svg>
        <div class="donut-center">
          <span class="donut-amt" id="donutAmt"></span>
          <span class="donut-sub" id="donutSub"></span>
        </div>
      </div>

      <div id="typeList"></div>

      <section class="trend-box" id="trendBox">
        <h2 class="sec-title" id="trendTitle"></h2>
        <div class="trend" id="trend"></div>
        <div class="trend-axis"><span id="trendFrom"></span><span id="trendTo"></span></div>
      </section>
    </div>
    <p class="empty" id="reportEmpty" hidden>No entries in this range.</p>
  </main>

  <script type="module" src="reports.js"></script>
</body>
</html>
