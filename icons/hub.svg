<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .c1 { stroke: var(--accent, #c9a24b); }
    .c2 { stroke: var(--accent-2, #4f9d8a); }
