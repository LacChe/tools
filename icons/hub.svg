    .t2 { fill: color-mix(in srgb, var(--accent-2, #4f9d8a) 24%, transparent); }
  </style>
  <g transform="translate(0 4)">
    <circle class="c1 t1" cx="24" cy="15" r="10.5"/>
    <circle class="c2 t2" cx="18" cy="25.4" r="10.5"/>
    <circle class="c1 t1" cx="30" cy="25.4" r="10.5"/>
  </g>
