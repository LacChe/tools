<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>输入密码 / Enter PIN</title>
<style>
  :root { --bg:#0d0f14; --bg2:#14171e; --parchment:#ece6d6; --muted:#8b93a3; --accent:#c9a24b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background: radial-gradient(ellipse at top, #171b24 0%, var(--bg) 60%);
    color: var(--parchment); font-family: 'Noto Serif SC','PingFang SC','Iowan Old Style','Palatino Linotype',Georgia,serif;
    display:flex; align-items:center; justify-content:center; }
  .lock-card { text-align:center; padding: 40px 32px; max-width: 360px; width: 100%; }
  .lock-title { font-size: 19px; margin: 0 0 6px; letter-spacing: 0.04em; }
  .lock-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 28px; }
  .pin-row { display:flex; gap: 8px; justify-content:center; margin-bottom: 22px; }
  .pin-row input { width: 40px; height: 50px; text-align:center; font-size: 22px;
    background: #161a22; border: 1.6px solid #333a48; border-radius: 8px; color: var(--parchment); font-family: monospace; }
  .pin-row input:focus { outline:none; border-color: var(--accent); }
  .pin-row.shake { animation: shake 0.4s; }
  @keyframes shake { 10%,90% {transform:translateX(-2px);} 20%,80% {transform:translateX(4px);}
    30%,50%,70% {transform:translateX(-8px);} 40%,60% {transform:translateX(8px);} }
  .lock-msg { font-size: 12.5px; color: #c9694b; min-height: 16px; margin-bottom: 6px; }
  .remember-row { font-size: 12px; color: var(--muted); display:flex; align-items:center; justify-content:center; gap:6px; }
</style>
</head>
<body>
  <div class="lock-card">
    <div class="lock-title">输入密码 / Enter PIN</div>
    <div class="lock-sub">此内容仅供私人使用 · For personal use only</div>
    <div class="pin-row" id="pinRow">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="0"/>
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="1"/>
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="2"/>
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="3"/>
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="4"/>
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" data-i="5"/>
    </div>
    <div class="lock-msg" id="lockMsg">&nbsp;</div>
    <label class="remember-row"><input type="checkbox" id="rememberBox" checked/> 记住此设备 / remember this device</label>
  </div>

  const ITERATIONS = 250000;
  const STORAGE_KEY = "sw_wf_pin";
  function b64ToBytes(b64) { const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i); return arr; }
  async function deriveKey(pin, saltBytes) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt:saltBytes, iterations:ITERATIONS, hash:'SHA-256' },
      keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  }
  async function tryDecrypt(pin) {
    const saltBytes = b64ToBytes(SALT_B64), ivBytes = b64ToBytes(IV_B64), ctBytes = b64ToBytes(CT_B64);
    const key = await deriveKey(pin, saltBytes);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ivBytes }, key, ctBytes);
    return new TextDecoder().decode(plainBuf);
  }
  function getPin() { return Array.from(document.querySelectorAll('.pin-row input')).map(i => i.value || '').join(''); }
  async function attemptUnlock(pin) {
    const msg = document.getElementById('lockMsg'); const row = document.getElementById('pinRow');
    try {
      const html = await tryDecrypt(pin);
      if (document.getElementById('rememberBox').checked) { try { localStorage.setItem(STORAGE_KEY, pin); } catch(e) {} }
      document.open(); document.write(html); document.close();
    } catch (e) {
      msg.textContent = "密码错误 / Incorrect PIN";
      row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
      document.querySelectorAll('.pin-row input').forEach(i => i.value = '');
      document.querySelector('.pin-row input').focus();
      try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
    }
  }
  const inputs = Array.from(document.querySelectorAll('.pin-row input'));
  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[^0-9]/g, '').slice(0,1);
      if (inp.value && idx < inputs.length - 1) inputs[idx+1].focus();
      if (inputs.every(i => i.value.length === 1)) attemptUnlock(getPin());

    inp.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx-1].focus(); });
