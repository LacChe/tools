<!DOCTYPE html>
<html lang="en" data-app="login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Sign in</title>
  <link rel="stylesheet" href="base.css?v=5">
  <link rel="stylesheet" href="theme.css?v=5">
</head>
<body>
  <main class="page">
    <h1 data-i18n="signIn">Sign in</h1>
    <form class="stack" id="form">
      <input id="email" type="email" autocomplete="username" placeholder="Email" data-i18n-placeholder="email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" data-i18n-placeholder="password" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" data-i18n="signIn">Sign in</button>
    </form>
  </main>
  <script type="module">
    import { sb, HOME_URL } from "./auth.js";
    import { t, applyStatic } from "./hub-i18n.js";
    applyStatic();
    document.title = t("signIn");
    const { data } = await sb.auth.getSession();
    if (data.session) location.replace(HOME_URL);
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.textContent = "";
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      if (error) err.textContent = error.message;
      else location.replace(HOME_URL);
    });
  </script>
</body>
</html>
